        proxy_pass http://lingqiao_java_backend;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        allow 127.0.0.1;
        allow 172.26.11.198;
        allow 1.192.129.30;
        deny all;
        rewrite ^/admin/(.*)$ /java/web/admin/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://lingqiao_java_backend;
