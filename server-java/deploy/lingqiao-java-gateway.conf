upstream lingqiao_java_backend {
    server 127.0.0.1:49001;
    keepalive 32;
}

# Compatibility entrypoint for the original public server port.
server {
    listen 48901 ssl;
    server_name _;

    ssl_certificate /opt/injector-server/certs/server.crt;
    ssl_certificate_key /opt/injector-server/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 501m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    location = /api/health {
        rewrite ^ /java/api/health break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://lingqiao_java_backend;
    }

    location ^~ /api/v1/ {
        if ($request_method = OPTIONS) { return 204; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-HMAC-Signature, X-Client-ID, X-Timestamp, X-Nonce, X-Session-Token, Authorization" always;
        rewrite ^/api/v1/(.*)$ /java/api/v1/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_pass http://lingqiao_java_backend;
    }

    location ^~ /admin/api/ {
        if ($request_method = OPTIONS) { return 204; }
        # Admin UI still posts /admin/api/card/* (singular). Java serves cards.
        rewrite ^/admin/api/card/(.*)$ /java/admin/api/cards/$1 break;
        rewrite ^/admin/api/(.*)$ /java/admin/api/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_pass http://lingqiao_java_backend;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /java/web/admin/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://lingqiao_java_backend;
    }

    location ^~ /assets/ {
        rewrite ^/assets/(.*)$ /java/web/assets/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://lingqiao_java_backend;
    }

    location / {
        return 404;
    }
}

