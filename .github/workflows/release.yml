name: Build and Release Lingqiao

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v3.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 3.0.0)'
        required: true
        default: '3.0.0'

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Path / package consistency
      shell: pwsh
      run: |
        python scripts/check_admin_api_paths.py
        python scripts/check_autoexam_package.py

    - name: Get Version
      id: get_version
      shell: pwsh
      run: |
        $version = "${{ github.event.inputs.version }}"
        if (-not $version) {
          $version = "${{ github.ref_name }}".TrimStart('v')
        }
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "Version is $version"

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        arch: 'win32_msvc2019'
        dir: '${{ github.workspace }}\Qt'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: server/web/package-lock.json

    - name: Build Web UI
      shell: pwsh
      working-directory: server/web
      run: |
        npm ci
        npm run check

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.3'
        cache-dependency-path: |
          server/go.sum
          e2e_test/go.sum

    - name: Test Go Modules
      shell: pwsh
      run: |
        Push-Location server
        go test ./...
        Pop-Location

    - name: Test Java Server
      shell: pwsh
      run: |
        $mvn = Join-Path "${{ github.workspace }}" ".tools\apache-maven-3.9.11\bin\mvn.cmd"
        if (-not (Test-Path $mvn)) { throw "Maven distribution is missing: $mvn" }
        Push-Location server-java
        & $mvn -B test
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Pop-Location
        Push-Location e2e_test
        go test ./...
        Pop-Location

    - name: Build Go Server
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist\server | Out-Null
        Push-Location server
        go build -ldflags "-s -w" -o ..\dist\server\lingqiao-server.exe .
        Pop-Location

    - name: Build AutoExam Script
      shell: pwsh
      run: |
        & .\packages\autoexam\build.ps1

    - name: Install WiX Toolset v4
      shell: pwsh
      run: |
        dotnet tool install --global wix
        wix extension add WixToolset.Bal.wixext

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S client -B build-release -G "Visual Studio 17 2022" -A Win32 -DCMAKE_PREFIX_PATH="${{ env.Qt5_DIR }}" -DAPP_VERSION="${{ env.VERSION }}"

    - name: Build Application
      shell: pwsh
      run: |
        cmake --build build-release --config Release

    - name: Collect Qt Dependencies (windeployqt)
      shell: pwsh
      run: |
        $windeployqt = Join-Path "${{ env.Qt5_DIR }}" "bin\windeployqt.exe"
        $exePath = "build-release\src\Release\CX_LingQiao.exe"
        & $windeployqt --no-translations --no-opengl-sw --release $exePath

    - name: Build Installer (WiX)
      shell: pwsh
      run: |
        $version = "${{ env.VERSION }}"
        $sourceDir = Resolve-Path "build-release\src\Release"
        & .\installer\build_installer.ps1 -Version $version -SourceDir $sourceDir -OutputDir "dist\installer"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Lingqiao-Installers
        path: dist\installer\*

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/installer/*
        name: Release ${{ env.VERSION }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
